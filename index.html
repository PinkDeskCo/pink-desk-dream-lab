<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pink Desk Dream Lab</title>

    <link
        rel="stylesheet"
        href="assets/css/dream-lab.css"
    >
</head>

<body>

    <header class="dream-header"></header>

    <main>

        <section class="dream-hero"></section>

        <section class="dream-testimonial"></section>

        <section class="dream-session"
            id="dream-session"
        >
            <div class="dream-session__stage">

                <video
                    class="dream-session__video"
                    muted
                    playsinline
                    preload="auto"
                >
                    <source
                        src="assets/images/dream-session/videos/dream-session.mp4"
                        type="video/mp4"
                    >
                </video>

                <!-- Thinking overlays -->
              <div class="dream-session__overlays">

                    <div class="
                            dream-thought-text
                            dream-thought-text--one
                        "
                    >
                        what if...
                    </div>

                    <div class="
                            dream-thought-text
                            dream-thought-text--two
                        "
                    >
                        a better way?
                    </div>

                    <div class="
                            dream-thought-spark
                        "
                        aria-hidden="true"
                    >
                        ✦
                    </div>

                    <div class="dream-magic"
                        aria-hidden="true"
                    >
                        <span class="dream-magic__spark dream-magic__spark--1">✦</span>
                        <span class="dream-magic__spark dream-magic__spark--2">✧</span>
                        <span class="dream-magic__spark dream-magic__spark--3">✦</span>
                        <span class="dream-magic__spark dream-magic__spark--4">✧</span>
                    </div>

                </div>

            </div>
        </section>

        <section class="dream-concept-card"></section>

    </main>


    <script src="assets/js/dream-lab.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pink Desk Dream Lab</title>

    <link
        rel="stylesheet"
        href="assets/css/dream-lab.css"
    >
</head>

<body>

    <header class="dream-header"></header>

    <main>

        <section class="dream-hero"></section>

        <section class="dream-testimonial"></section>

        <section
            class="dream-session"
            id="dream-session"
        >

            <div class="dream-session__stage">

                <div
                    class="
                        dream-session__scene
                        dream-session__scene--share
                    "
                >
                    <img
                        src="assets/images/dream-session/scene-01-share.png"
                        alt=""
                    >
                </div>

                <div
                    class="
                        dream-session__scene
                        dream-session__scene--think
                    "
                >
                    <img
                        src="assets/images/dream-session/scene-02-think.png"
                        alt=""
                    >

                    <div
                        class="
                            dream-thought
                            dream-thought--one
                        "
                    >
                        What if...?
                    </div>

                    <div
                        class="
                            dream-thought
                            dream-thought--two
                        "
                    >
                        A custom tool?
                    </div>

                    <div
                        class="
                            dream-thought
                            dream-thought--three
                        "
                    >
                        A better experience?
                    </div>
                </div>

                <div
                    class="
                        dream-session__scene
                        dream-session__scene--lab
                    "
                >
                    <img
                        src="assets/images/dream-session/scene-03-lab.png"
                        alt=""
                    >
                </div>

            </div>

        </section>

        <section class="dream-concept-card"></section>

    </main>

    <script src="assets/js/dream-lab.js"></script>

</body>

</html>
